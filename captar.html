<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fale com a gente</title>
<meta name="theme-color" content="#0E1726">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Página pública de captação: um cartão de formulário sobre fundo na cor do produto. */
:root { --brand: #2F5BEA; --bg: #F4F6F9; --surface: #fff; --fg: #0E1726; --muted: #5F6B7F; --line: #DCE2EA; --ok: #128C4B;
  --f-d: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; --f-b: "Instrument Sans", system-ui, -apple-system, sans-serif; }
@media (prefers-color-scheme: dark) { :root { --bg: #0B111C; --surface: #131B28; --fg: #E8EDF5; --muted: #95A1B6; --line: #283349; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--f-b); }
.hero { background: var(--brand); color: #fff; padding: calc(48px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) 110px max(20px, env(safe-area-inset-left, 0px)); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -80px; top: -80px; width: 320px; height: 320px; border-radius: 50%; border: 40px solid rgba(255,255,255,.08); }
.hero-in { max-width: 560px; margin: 0 auto; position: relative; z-index: 1; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
h1 { font: 800 clamp(30px, 7vw, 42px)/1.08 var(--f-d); letter-spacing: -.025em; margin: 8px 0 12px; text-wrap: balance; }
.hero p { margin: 0; font-size: 17px; opacity: .92; max-width: 46ch; }
main { max-width: 560px; margin: -80px auto 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); position: relative; z-index: 2; }
.card { background: var(--surface); border-radius: 18px; padding: 24px; box-shadow: 0 20px 50px rgba(14, 23, 38, .15); border: 1px solid var(--line); }
form { display: grid; gap: 14px; }
label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
label small { font-weight: 500; color: var(--muted); }
input, textarea { font: inherit; color: var(--fg); background: var(--bg); width: 100%; height: 48px; border: 1px solid var(--line); border-radius: 11px; padding: 0 14px; }
textarea { height: auto; min-height: 92px; padding: 12px 14px; resize: vertical; }
input:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 480px) { .two { grid-template-columns: 1fr; } }
button { font: 700 16px var(--f-b); height: 52px; border: 0; border-radius: 12px; background: var(--ok); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
button:hover { filter: brightness(1.06); }
button:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.err { color: #C92A2A; font-size: 14px; font-weight: 600; margin: 0; }
.fine { color: var(--muted); font-size: 13px; text-align: center; margin: 4px 0 0; }
.done { text-align: center; display: grid; gap: 12px; justify-items: center; padding: 10px 0; }
.done .ok { width: 64px; height: 64px; border-radius: 50%; background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); display: grid; place-items: center; }
.done h2 { font: 800 26px var(--f-d); margin: 0; letter-spacing: -.02em; }
.done p { margin: 0; color: var(--muted); max-width: 40ch; }
.done a { color: var(--ok); font-weight: 700; }
footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 16px 30px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header class="hero"><div class="hero-in">
  <div class="eyebrow" id="h_eyebrow"></div>
  <h1 id="h_title"></h1>
  <p id="h_sub"></p>
</div></header>
<main>
  <div class="card">
    <form id="f" novalidate>
      <label><span id="l_nome"></span><input id="nome" autocomplete="name" required></label>
      <div class="two">
        <label><span id="l_tel"></span><input id="tel" type="tel" inputmode="tel" autocomplete="tel" required></label>
        <label><span id="l_emp"></span><input id="emp" autocomplete="organization"></label>
      </div>
      <div class="two">
        <label><span id="l_email"></span><input id="email" type="email" autocomplete="email"></label>
        <label><span id="l_cid"></span><input id="cid" autocomplete="address-level2"></label>
      </div>
      <label><span id="l_msg"></span><textarea id="msg"></textarea></label>
      <p class="err" id="err" hidden></p>
      <button type="submit"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 20.5 5 16a8.5 8.5 0 1 1 3.2 3.1z"/></svg><span id="b_send"></span></button>
      <p class="fine" id="fine"></p>
    </form>
    <div class="done" id="done" hidden>
      <div class="ok"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
      <h2 id="d_title"></h2><p id="d_sub"></p><a id="d_again" target="_blank" rel="noopener" href="#"></a>
    </div>
  </div>
</main>
<footer id="foot"></footer>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const L = { pt: {
      eyebrow: "Fale com a gente", title: p => p ? `Quero saber mais sobre ${p}` : "Vamos conversar?", sub: e => `Deixe seu contato e a equipe ${e ? "da " + e + " " : ""}responde pelo WhatsApp.`,
      nome: "Seu nome", tel: "WhatsApp", emp: "Empresa", email: "E-mail", cid: "Cidade", msg: "Como podemos ajudar?", opt: "opcional",
      send: "Enviar pelo WhatsApp", fine: "Ao enviar, o WhatsApp abre com sua mensagem pronta.", need: "Preencha seu nome e WhatsApp.",
      dTitle: "Quase lá!", dSub: "Confirme o envio no WhatsApp. Se ele não abriu, toque abaixo.", again: "Abrir WhatsApp de novo",
      head: "Novo contato pelo site", f: { nome: "Nome", emp: "Empresa", tel: "WhatsApp", email: "E-mail", cid: "Cidade", prod: "Interesse", msg: "Mensagem" }, noWa: "Este link está incompleto: falta o número de WhatsApp." },
    en: { eyebrow: "Get in touch", title: p => p ? `I'd like to know more about ${p}` : "Let's talk", sub: e => `Leave your details and ${e || "our team"} will reply on WhatsApp.`,
      nome: "Your name", tel: "WhatsApp", emp: "Company", email: "Email", cid: "City", msg: "How can we help?", opt: "optional",
      send: "Send via WhatsApp", fine: "WhatsApp opens with your message ready to send.", need: "Please enter your name and WhatsApp.",
      dTitle: "Almost there!", dSub: "Confirm the message in WhatsApp. If it didn't open, tap below.", again: "Open WhatsApp again",
      head: "New contact from the website", f: { nome: "Name", emp: "Company", tel: "WhatsApp", email: "Email", cid: "City", prod: "Interest", msg: "Message" }, noWa: "This link is incomplete: the WhatsApp number is missing." },
    es: { eyebrow: "Contáctanos", title: p => p ? `Quiero saber más sobre ${p}` : "¿Hablamos?", sub: e => `Déjanos tus datos y ${e ? "el equipo de " + e : "nuestro equipo"} te responde por WhatsApp.`,
      nome: "Tu nombre", tel: "WhatsApp", emp: "Empresa", email: "Correo", cid: "Ciudad", msg: "¿En qué podemos ayudarte?", opt: "opcional",
      send: "Enviar por WhatsApp", fine: "Al enviar, WhatsApp se abre con tu mensaje listo.", need: "Escribe tu nombre y WhatsApp.",
      dTitle: "¡Casi listo!", dSub: "Confirma el envío en WhatsApp. Si no se abrió, toca abajo.", again: "Abrir WhatsApp otra vez",
      head: "Nuevo contacto desde la web", f: { nome: "Nombre", emp: "Empresa", tel: "WhatsApp", email: "Correo", cid: "Ciudad", prod: "Interés", msg: "Mensaje" }, noWa: "Este enlace está incompleto: falta el número de WhatsApp." } };
  const lang = L[q.get("l")] ? q.get("l") : (navigator.language || "pt").slice(0, 2) in L ? (navigator.language || "pt").slice(0, 2) : "pt";
  const T = L[lang], emp = (q.get("e") || "").slice(0, 60), prod = (q.get("p") || "").slice(0, 60), wa = (q.get("w") || "").replace(/\D/g, ""), color = q.get("c");
  if (color && /^[0-9a-f]{6}$/i.test(color)) document.documentElement.style.setProperty("--brand", "#" + color);
  document.documentElement.lang = { pt: "pt-BR", en: "en", es: "es" }[lang];
  const $ = id => document.getElementById(id), set = (id, v) => { $(id).textContent = v; };
  document.title = (emp ? emp + " · " : "") + T.eyebrow;
  set("h_eyebrow", emp || T.eyebrow); set("h_title", T.title(prod)); set("h_sub", T.sub(emp));
  set("l_nome", T.nome); set("l_tel", T.tel); set("l_cid", T.cid); set("b_send", T.send); set("fine", T.fine);
  $("l_emp").innerHTML = ""; $("l_emp").append(T.emp + " ", Object.assign(document.createElement("small"), { textContent: "(" + T.opt + ")" }));
  $("l_email").innerHTML = ""; $("l_email").append(T.email + " ", Object.assign(document.createElement("small"), { textContent: "(" + T.opt + ")" }));
  $("l_msg").innerHTML = ""; $("l_msg").append(T.msg + " ", Object.assign(document.createElement("small"), { textContent: "(" + T.opt + ")" }));
  set("d_title", T.dTitle); set("d_sub", T.dSub); set("d_again", T.again);
  set("foot", emp ? "© " + new Date().getFullYear() + " " + emp : "");
  if (!wa) { $("err").hidden = false; $("err").textContent = T.noWa; }
  $("f").addEventListener("submit", e => {
    e.preventDefault();
    const v = id => $(id).value.trim();
    if (!v("nome") || v("tel").replace(/\D/g, "").length < 8) { $("err").hidden = false; $("err").textContent = T.need; (v("nome") ? $("tel") : $("nome")).focus(); return; }
    if (!wa) return;
    const F = T.f, lines = [`*${T.head}*`, `${F.nome}: ${v("nome")}`, v("emp") && `${F.emp}: ${v("emp")}`, `${F.tel}: ${v("tel")}`, v("email") && `${F.email}: ${v("email")}`,
      v("cid") && `${F.cid}: ${v("cid")}`, prod && `${F.prod}: ${prod}`, v("msg") && `${F.msg}: ${v("msg").replace(/\n+/g, " ")}`].filter(Boolean);
    const url = "https://wa.me/" + wa + "?text=" + encodeURIComponent(lines.join("\n"));
    $("d_again").href = url; $("f").hidden = true; $("done").hidden = false;
    location.href = url;
  });
})();
</script>
</body>
</html>
